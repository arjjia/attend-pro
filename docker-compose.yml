services:
  db:
    image: postgres:latest
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-attendpro}
      POSTGRES_USER: ${POSTGRES_USER:-attendpro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-attendpro}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql
    ports:
      - "5432:5432"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-attendpro}:${POSTGRES_PASSWORD:-attendpro}@db:5432/${POSTGRES_DB:-attendpro}
      JWT_SECRET: ${JWT_SECRET:-development-only-change-me}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173,http://127.0.0.1:4173
      SEED_DATE: ${SEED_DATE:-}
    command: ["sh", "-c", "uv run --locked alembic upgrade head && uv run --locked python -m app.seed && uv run --locked uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  postgres_data:
