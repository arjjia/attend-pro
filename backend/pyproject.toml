[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "attend-pro-backend"
version = "0.1.0"
description = "AttendPro MVP API"
requires-python = ">=3.10"
dependencies = [
  "alembic>=1.13,<2",
  "asyncpg>=0.29,<1",
  "bcrypt>=4.1,<5",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.5,<3",
  "PyJWT>=2.9,<3",
  "qrcode[pil]>=8,<9",
  "sqlalchemy[asyncio]>=2.0.35,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "aiosqlite>=0.20,<1",
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
